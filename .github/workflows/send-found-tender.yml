name: ECOFLOT resend selected tender

on:
  push:
    paths:
      - ".github/workflows/send-found-tender.yml"

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send selected tender to Telegram
        run: |
          set -euo pipefail
          curl -sS -L -X POST \
            --data-urlencode "type=Тендер" \
            --data-urlencode "name=Вывоз строительного мусора" \
            --data-urlencode "phone=-" \
            --data-urlencode "wasteType=Строительный мусор / контейнеры / мультилифты / самосвалы" \
            --data-urlencode "volume=-" \
            --data-urlencode "when=Заявки до 02.10.2026 14:30" \
            --data-urlencode "address=Москва" \
            --data-urlencode "source=Росэлторг / B2B.House" \
            --data-urlencode "status=Новый тендер" \
            --data-urlencode "comment=Заказчик: ООО «Региональное управление КМЗ». Начальная цена: 44 225 000 ₽. Прямое соответствие ECOFLOT: строительный мусор, контейнеры, мультилифты, бункеровозы, самосвалы. Скоринг: 95/100. Ссылка: https://b2b.house/activepurchase/rd3e94aed-b320-4605-8eaa-f4c5af67e014_ef424614/" \
            --data-urlencode "link=https://b2b.house/activepurchase/rd3e94aed-b320-4605-8eaa-f4c5af67e014_ef424614/" \
            --data-urlencode "requestId=TG-RESEND-B2409261352496-20260926-1" \
            "https://script.google.com/macros/s/AKfycbzDedkBi9soafe6DuR0TX0Enpg0vcgX87gNyOLsl30kL4COSuwdmPWO64c1ZzNodmFlRg/exec"
