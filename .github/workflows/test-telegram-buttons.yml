name: ECOFLOT Telegram route diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-telegram-buttons.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Apps Script and Telegram webhook route
        run: |
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          base = "https://script.google.com/macros/s/AKfycbzDedkBi9soafe6DuR0TX0Enpg0vcgX87gNyOLsl30kL4COSuwdmPWO64c1ZzNodmFlRg/exec"

          for label, url in [
              ("ROOT", base),
              ("WEBHOOK_INFO", base + "?action=webhookInfo"),
          ]:
              try:
                  with urllib.request.urlopen(url, timeout=30) as r:
                      body = r.read().decode("utf-8", "replace")
                      print(label + "_HTTP:", r.status)
                      print(label + "_BODY:", body)
              except Exception as exc:
                  print(label + "_ERROR:", repr(exc))
                  raise
          PY

      - name: Probe notify-only structured report contract
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          base = "https://script.google.com/macros/s/AKfycbzDedkBi9soafe6DuR0TX0Enpg0vcgX87gNyOLsl30kL4COSuwdmPWO64c1ZzNodmFlRg/exec"
          cycle = "2026-10-10 09:00 DIAGNOSTIC"
          message = "ECOFLOT тест structured report delivery"
          report = {
              "status":"COMPLETE",
              "searchMode":"Diagnostic",
              "new":0,
              "accepted":0,
              "errors":0,
              "uncheckedSources":[],
              "message":message,
          }
          candidates = [
              {"mode":"notify-only","cycleKey":cycle,"report":{"message":message}},
              {"mode":"notify-only","cycle":cycle,"report":{"message":message}},
              {"mode":"notify-only","cycleKey":cycle,"searchReport":{"message":message}},
              {"mode":"notify-only","cycleKey":cycle,"report":report},
              {"mode":"notify-only","cycle":cycle,"searchReport":report},
              {"mode":"notify-only","cycleKey":cycle,"message":message,"report":report},
          ]

          for i,payload in enumerate(candidates,1):
              req = urllib.request.Request(
                  base,
                  data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
                  method="POST",
                  headers={"Content-Type":"application/json; charset=utf-8",
                           "User-Agent":"ECOFLOT-Protocol-Probe/2.0"},
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  body = r.read().decode("utf-8", "replace")
              print("PROBE", i, body)
              try:
                  parsed = json.loads(body)
              except Exception:
                  parsed = {}
              if parsed.get("telegramSent") is True or parsed.get("sent") is True or parsed.get("routes"):
                  print("PROBE_SUCCESS", i, body)
                  break
          PY

      - name: Process Telegram outbox directly
        run: |
          python3 - <<'PY'
          import urllib.request
          base = "https://script.google.com/macros/s/AKfycbzDedkBi9soafe6DuR0TX0Enpg0vcgX87gNyOLsl30kL4COSuwdmPWO64c1ZzNodmFlRg/exec"
          for action in ("processTelegramOutbox","processOutbox","flushTelegramQueue","dispatchQueue"):
              url = base + "?action=" + action
              try:
                  with urllib.request.urlopen(url, timeout=60) as r:
                      body = r.read().decode("utf-8","replace")
                      print("OUTBOX_ACTION", action, r.status, body)
              except Exception as exc:
                  print("OUTBOX_ACTION_ERROR", action, repr(exc))
          PY
