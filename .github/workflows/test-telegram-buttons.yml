name: Test Telegram status buttons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-telegram-buttons.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check Telegram webhook target
        run: |
          python3 - <<'PY'
          import urllib.request
          url = "https://script.google.com/macros/s/AKfycbzDedkBi9soafe6DuR0TX0Enpg0vcgX87gNyOLsl30kL4COSuwdmPWO64c1ZzNodmFlRg/exec?action=webhookInfo"
          with urllib.request.urlopen(url, timeout=30) as r:
              print(r.read().decode("utf-8","replace"))
          PY
