name: ECOFLOT Telegram route diagnostic

on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect deployed ECOFLOT bridge
        run: |
          python3 - <<'PY'
          import urllib.request
          base = "https://script.google.com/macros/s/AKfycbzDedkBi9soafe6DuR0TX0Enpg0vcgX87gNyOLsl30kL4COSuwdmPWO64c1ZzNodmFlRg/exec"
          with urllib.request.urlopen(base, timeout=30) as r:
              body = r.read().decode("utf-8", "replace")
              print("ROOT_HTTP:", r.status)
              print("ROOT_BODY:", body)
          PY
