name: ECOFLOT chain test

on:
  push:
    paths:
      - ".github/workflows/test-telegram-chain.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send test through ECOFLOT webhook
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -L -X POST \
            --data-urlencode "type=ТЕСТ ЦЕПОЧКИ" \
            --data-urlencode "name=Тестовый тендер ECOFLOT" \
            --data-urlencode "phone=-" \
            --data-urlencode "wasteType=Тест автоматического мониторинга тендеров" \
            --data-urlencode "volume=-" \
            --data-urlencode "when=Сейчас" \
            --data-urlencode "address=Одинцово, Московская область" \
            --data-urlencode "source=GitHub Actions / тест цепочки" \
            --data-urlencode "status=Тест" \
            --data-urlencode "comment=Это тестовое сообщение. Проверяем цепочку GitHub → Apps Script → Telegram. Реальной заявки или тендера нет." \
            --data-urlencode "requestId=TEST-TENDER-CHAIN-${GITHUB_RUN_ID}" \
            "https://script.google.com/macros/s/AKfycbwCCbbs2fu3rJc_GKjNl59aei1urvognFrmgSjnJFpe3jQ-OcCCefJqJj91RMXFJJDaTg/exec")
          echo "Webhook response: $RESPONSE"
          python3 - "$RESPONSE" <<'PY'
          import json, sys
          body=sys.argv[1]
          data=json.loads(body)
          assert data.get("ok") is True, data
          assert data.get("telegramSent") is True, data
          print("CHAIN_OK", data.get("requestId"))
          PY
