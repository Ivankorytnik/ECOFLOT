name: ECOFLOT report key repair 2026-10-17
on:
  push:
    branches: [main]
    paths: ['.github/workflows/report-key-repair-20261017.yml']
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Confirm journal keys and ask native server to aggregate existing results
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import search_reporting as r
          cycle = '2026-10-16 08:00'
          state = r.load_json(Path('search_cycle_history.json'))['cycles'][cycle]
          expected = r.active_chats(r.sheet_rows(r.SHEET_ID, r.USERS, 'A,E'))
          if not expected: raise RuntimeError('NO_VERIFIED_RECIPIENTS')
          logs = r.sheet_rows(r.SHEET_ID, 'Журнал поисков', 'B,C')
          known = {str(row[0]): str(row[1]) for row in logs if len(row)>1}
          if any(known.get(cycle+'|'+name) != cycle for name in r.NAMES):
            raise RuntimeError('JOURNAL_CYCLE_KEYS_NOT_EXACT_TEXT')
          ledger = r.load_json(r.RECEIPTS, {'items':{}})['items']
          rows = r.sheet_rows(r.SHEET_ID, r.LEADS, 'L,M,U,V,O,J')
          payload = r.build_payloads(state, r.qualified_rollup(cycle, ledger, rows, expected))[-1]
          result = r.post_report(payload)
          print('NATIVE_REPORT_ACK', result.get('recorded'), result.get('cycleKey'), result.get('status'))
          print('No lead cards replayed. Summary delivery is verified by the already running recovery job.')
          PY
