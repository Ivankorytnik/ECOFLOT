name: ECOFLOT outbox repair
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/outbox-repair.yml"
  workflow_dispatch:
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Process Telegram outbox
        shell: bash
        run: |
          set -euo pipefail
          URL="https://script.google.com/macros/s/AKfycbzDedkBi9soafe6DuR0TX0Enpg0vcgX87gNyOLsl30kL4COSuwdmPWO64c1ZzNodmFlRg/exec"
          curl -fsS -L -X POST "$URL" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data '{"mode":"process-outbox","cycleKey":"2026-10-05 08:00"}'
