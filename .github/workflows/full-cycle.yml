name: ECOFLOT full cycle
on:
  schedule:
    # Separate expressions preserve each slot's identity after queue delays.
    - cron: '0,12,32 5 * * *'
    - cron: '0,12,32 11 * * *'
    - cron: '0,12,32 15 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run one extra cycle, without reusing a scheduled cycle key'
        type: boolean
        default: false
  workflow_call:
    inputs:
      force:
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'full-cycle-trigger.txt'
      - 'internet-manual-trigger.txt'
      - 'manual-trigger-token.txt'
      - 'search-reliability-check.txt'
permissions:
  contents: write
concurrency:
  group: ecoflot-search-state
  cancel-in-progress: false
jobs:
  full-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate search contracts
        run: |
          python3 -m compileall -q scripts
          python3 -m unittest discover -s scripts -p 'test_search_*.py' -v
      - name: Run or reconcile one orchestrated cycle
        env:
          MAX_SEND: '100'
          RECENT_DAYS: '7'
          SUPPRESS_NO_RESULTS: '1'
          ECOFLOT_SCHEDULE: ${{ github.event.schedule }}
          ECOFLOT_FORCE: ${{ (github.event_name == 'push' || inputs.force) && '1' || '0' }}
        run: python3 -u scripts/scheduled_cycle_runner.py
      - name: Persist state even after source or delivery failure
        if: always()
        run: bash scripts/persist_search_state.sh
      - name: Preserve recovery state and readable report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecoflot-cycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            full_cycle_state.json
            search_cycle_history.json
            search_delivery_receipts.json
            search_cycle_report.md
            internet_leads_state.json
            social_public_leads_state.json
            max_public_leads_state.json
            tender_state.json
            object_leads_state.json
            telegram_retry_queue.json
          if-no-files-found: warn
          retention-days: 30
