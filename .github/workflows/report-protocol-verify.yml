name: ECOFLOT native report protocol verification
on:
  push:
    branches: ['repair/20261017-report-protocol']
permissions:
  contents: write
concurrency:
  group: ecoflot-report-repair
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ECOFLOT_NOTIFY_SUMMARY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/20261017-report-protocol
          fetch-depth: 0
      - run: python3 maintenance/apply_reporting_20261017.py
      - name: Verify all search regressions, no live sends
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts
          python3 -m unittest discover -s scripts -p 'test_search_*.py' -v
          node tests/server_guards.test.js
      - name: Persist verified source on repair branch only
        run: |
          set -euo pipefail
          git add scripts/full_cycle_orchestrator.py
          if ! git diff --cached --quiet; then
            git config user.name ecoflot-bot
            git config user.email ecoflot-bot@users.noreply.github.com
            git commit -m 'Use native v5 search reports with qualified counts and receipt verification'
            git push origin HEAD:refs/heads/repair/20261017-report-protocol
          fi
          git rev-parse HEAD
