name: ECOFLOT cycle delivery control (manual reserve)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send full-cycle Telegram control report
        run: python3 scripts/cycle_report.py

      - name: Save retry queue if report delivery failed
        if: always()
        run: |
          if [ -n "$(git status --porcelain telegram_retry_queue.json)" ]; then
            git config user.name "ecoflot-bot"
            git config user.email "ecoflot-bot@users.noreply.github.com"
            git add telegram_retry_queue.json
            git commit -m "Queue cycle control Telegram report"
            git pull --rebase origin main
            git push origin main
          fi
