name: ECOFLOT scheduled fallback

on:
  schedule:
    # Recovery wake-up 30 minutes after each primary slot.
    - cron: '37 5 * * *'
    - cron: '37 11 * * *'
    - cron: '37 15 * * *'
  push:
    branches: [main]
    paths:
      - 'scheduled-fallback-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ecoflot-search-state
  cancel-in-progress: false

jobs:
  fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve guarded logical slot
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "ECOFLOT_SCHEDULE=$EVENT_SCHEDULE" >> "$GITHUB_ENV"
            echo "ECOFLOT_FALLBACK_FORCE=0" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "ECOFLOT_FALLBACK_FORCE=0" >> "$GITHUB_ENV"
            exit 0
          fi

          trigger_content="$(git show "$GITHUB_SHA:scheduled-fallback-trigger.txt")"
          key="$(printf '%s\n' "$trigger_content" | sed -n '1p' | tr -d '\r\n')"
          mode="$(printf '%s\n' "$trigger_content" | sed -n '2p' | tr -d '\r\n')"

          if ! printf '%s' "$key" | grep -Eq '^20[0-9]{2}-[0-9]{2}-[0-9]{2} (08|14|18):00$'; then
            echo "Invalid fallback cycle key: $key" >&2
            exit 2
          fi
          if [ -n "$mode" ] && [ "$mode" != "force" ]; then
            echo "Invalid fallback mode: $mode" >&2
            exit 2
          fi

          echo "ECOFLOT_CYCLE_KEY=$key" >> "$GITHUB_ENV"
          if [ "$mode" = "force" ]; then
            echo "ECOFLOT_FALLBACK_FORCE=1" >> "$GITHUB_ENV"
          else
            echo "ECOFLOT_FALLBACK_FORCE=0" >> "$GITHUB_ENV"
          fi

      - name: Validate search contracts
        run: |
          python3 -m compileall -q scripts
          python3 -m unittest discover -s scripts -p 'test_search_*.py' -v

      - name: Run missing slot or reconcile if native cron arrived first
        env:
          MAX_SEND: '100'
          RECENT_DAYS: '7'
          SUPPRESS_NO_RESULTS: '1'
          ECOFLOT_FORCE: ${{ env.ECOFLOT_FALLBACK_FORCE }}
          ECOFLOT_SCHEDULE: ${{ env.ECOFLOT_SCHEDULE }}
        run: python3 -u scripts/scheduled_cycle_runner.py

      - name: Persist state even after source or delivery failure
        if: always()
        run: bash scripts/persist_search_state.sh

      - name: Preserve recovery state and readable report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecoflot-fallback-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            full_cycle_state.json
            search_cycle_history.json
            search_delivery_receipts.json
            search_cycle_report.md
            internet_leads_state.json
            social_public_leads_state.json
            max_public_leads_state.json
            tender_state.json
            object_leads_state.json
            telegram_retry_queue.json
          if-no-files-found: warn
          retention-days: 30
