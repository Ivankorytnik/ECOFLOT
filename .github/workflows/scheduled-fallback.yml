name: ECOFLOT scheduled fallback
on:
  push:
    branches: [main]
    paths:
      - 'scheduled-fallback-trigger.txt'
permissions:
  contents: write
concurrency:
  group: ecoflot-search-state
  cancel-in-progress: false
jobs:
  fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve guarded logical slot
        shell: bash
        run: |
          key="$(tr -d '\r\n' < scheduled-fallback-trigger.txt)"
          if ! printf '%s' "$key" | grep -Eq '^20[0-9]{2}-[0-9]{2}-[0-9]{2} (08|14|18):00$'; then
            echo "Invalid fallback cycle key: $key" >&2
            exit 2
          fi
          echo "ECOFLOT_CYCLE_KEY=$key" >> "$GITHUB_ENV"
      - name: Validate search contracts
        run: |
          python3 -m compileall -q scripts
          python3 -m unittest discover -s scripts -p 'test_search_*.py' -v
      - name: Run missing slot or reconcile if native cron arrived first
        env:
          MAX_SEND: '100'
          RECENT_DAYS: '7'
          SUPPRESS_NO_RESULTS: '1'
          ECOFLOT_FORCE: '0'
        run: python3 -u scripts/scheduled_cycle_runner.py
      - name: Persist state even after source or delivery failure
        if: always()
        run: bash scripts/persist_search_state.sh
      - name: Preserve recovery state and readable report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecoflot-fallback-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            full_cycle_state.json
            search_cycle_history.json
            search_delivery_receipts.json
            search_cycle_report.md
            internet_leads_state.json
            social_public_leads_state.json
            max_public_leads_state.json
            tender_state.json
            object_leads_state.json
            telegram_retry_queue.json
          if-no-files-found: warn
          retention-days: 30
