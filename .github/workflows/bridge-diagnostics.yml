name: ECOFLOT bridge read-only diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/bridge-diagnostics.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ECOFLOT_NOTIFY_SUMMARY: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Inspect bridge health and bounded search responses
        run: |
          python3 - <<'PY'
          import json, sys, urllib.request, urllib.parse
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from internet_leads_monitor import WEBHOOK
          from concurrent.futures import ThreadPoolExecutor
          Path('diagnostics').mkdir(exist_ok=True)
          endpoints = {
            'bridge-health': WEBHOOK,
            'google': 'https://www.google.com/search?' + urllib.parse.urlencode({'q':'site:profi.ru/rabota/remont/ вывоз грунта Москва','num':10,'hl':'ru'}),
            'bing': 'https://www.bing.com/search?' + urllib.parse.urlencode({'q':'"нужен самосвал" Москва','format':'rss','setlang':'ru','cc':'ru'}),
            'max': 'https://max.ru/',
          }
          def inspect(pair):
            name,url=pair
            try:
              req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 ECOFLOT-Diagnostics/1.0','Accept-Language':'ru-RU,ru;q=0.9,en;q=0.5'})
              with urllib.request.urlopen(req,timeout=25) as r:
                body=r.read(350000).decode('utf-8','replace')
                result={'name':name,'http':r.status,'content_type':r.headers.get('Content-Type'),'bytes':len(body)}
              if name=='bridge-health':
                try:
                  p=json.loads(body)
                  result['keys']=list(p)
                  result['health']={k:v for k,v in p.items() if k.lower() in {'ok','version','build','status','capabilities','modes','message','error','reason','features','outbox','pending','service'}}
                except ValueError: result['snippet']=body[:1200]
              else:
                Path('diagnostics/'+name+'.txt').write_text(body,encoding='utf-8')
                result['snippet']=body[:1000]
              print(json.dumps(result,ensure_ascii=False),flush=True)
            except Exception as e: print(json.dumps({'name':name,'error':str(e)},ensure_ascii=False),flush=True)
          with ThreadPoolExecutor(max_workers=4) as pool: list(pool.map(inspect,endpoints.items()))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecoflot-bridge-diagnostics
          path: diagnostics/
          retention-days: 3
