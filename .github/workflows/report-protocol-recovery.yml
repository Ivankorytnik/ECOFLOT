name: ECOFLOT native report recovery
on:
  push:
    branches: [main]
    paths:
      - 'scripts/search_reporting.py'
      - 'report-retry-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ecoflot-search-state
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Native report tests
        run: python3 -m unittest discover -s scripts -p 'test_search_reporting.py' -v
      - name: Deliver only an existing cycle report, never replay leads
        env:
          ECOFLOT_NOTIFY_SUMMARY: '1'
          ECOFLOT_REPORT_WAIT_SECONDS: '480'
        run: |
          python3 -u - <<'PY'
          import json, os, subprocess, sys
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          latest = json.loads(Path('full_cycle_state.json').read_text())['cycleKey']
          explicit = False
          if os.environ.get('GITHUB_EVENT_NAME') == 'push':
              changed = subprocess.check_output(['git', 'diff-tree', '--no-commit-id', '--name-only', '-r', os.environ['GITHUB_SHA'], '--', 'report-retry-trigger.txt'], text=True)
              explicit = 'report-retry-trigger.txt' in changed.splitlines()
          cycle = Path('report-retry-trigger.txt').read_text('utf-8').splitlines()[0].strip() if explicit else latest
          target = datetime.strptime(cycle[:16], '%Y-%m-%d %H:%M').replace(tzinfo=ZoneInfo('Europe/Moscow'))
          now = datetime.now(ZoneInfo('Europe/Moscow'))
          if target > now or now - target > timedelta(days=7):
              raise RuntimeError('REPORT_CYCLE_OUTSIDE_SAFE_RECOVERY_WINDOW')
          history = json.loads(Path('search_cycle_history.json').read_text())['cycles']
          if cycle not in history or history[cycle].get('status') not in ('COMPLETE', 'SEARCH_PARTIAL', 'SEARCH_FAILED', 'DELIVERY_PENDING'):
              raise RuntimeError('NO_COMPLETED_CYCLE_TO_REPORT')
          if explicit:
              sys.path.insert(0, 'scripts')
              import search_reporting as r
              expected = r.active_chats(r.sheet_rows(r.SHEET_ID, r.USERS, 'A,E'))
              if not expected: raise RuntimeError('NO_VERIFIED_RECIPIENTS')
              ledger = r.load_json(r.RECEIPTS, {'items':{}})['items']
              rows = r.sheet_rows(r.SHEET_ID, r.LEADS, 'L,M,U,V,O,J')
              payload = r.build_payloads(history[cycle], r.qualified_rollup(cycle, ledger, rows, expected))[-1]
              r.post_report(payload)
          raise SystemExit(subprocess.call(['python3', '-u', 'scripts/search_reporting.py', '--cycle', cycle]))
          PY
      - name: Preserve report evidence even if delivery is pending
        if: always()
        run: bash scripts/persist_search_state.sh
