name: ECOFLOT source depth and card checks
on:
  push:
    branches: ['repair/20261017-source-depth-cards']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ecoflot-source-depth-checks
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ECOFLOT_NOTIFY_SUMMARY: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Capture bounded public GET fixtures, no credentials and no lead writes
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request, concurrent.futures
          root=pathlib.Path('source-fixtures'); root.mkdir(exist_ok=True)
          urls={
            'rentag':'https://rentag.ru/arenda-spectehniki/zayavki',
            'exkavator':'https://exkavator.ru/exchange/rent/main.html',
            'nerudonline':'https://nerudonline.ru/rabota/samosvaly',
            'npd':'https://www.napodrabotku.ru/order/95097956',
            'telegram':'https://t.me/s/vsem_podryad',
            'telegram-trucks':'https://t.me/s/samosvalam_rabota',
            'b2b':'https://www.b2b-center.ru/market/?f_keyword=%D0%B2%D1%8B%D0%B2%D0%BE%D0%B7%20%D1%81%D0%BD%D0%B5%D0%B3%D0%B0',
          }
          def grab(pair):
            name,url=pair
            try:
              request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 ECOFLOT-Source-Verification/1.0','Accept-Language':'ru-RU,ru;q=0.9'})
              with urllib.request.urlopen(request,timeout=20) as response:
                raw=response.read(2000000); charset=response.headers.get_content_charset() or 'utf-8'
                page=raw.decode(charset,'replace'); final=response.geturl()
              (root/(name+'.html')).write_text(page,encoding='utf-8')
              return {'name':name,'url':url,'final_url':final,'bytes':len(raw)}
            except Exception as exc: return {'name':name,'url':url,'error':str(exc)[:300]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool: result=list(pool.map(grab,urls.items()))
          (root/'manifest.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Run offline regression suite
        run: |
          python3 -m compileall -q scripts
          python3 -m unittest discover -s scripts -p 'test_search_*.py' -v
          node tests/server_guards.test.js
      - name: Read-only acquisition smoke test when present
        run: |
          if [ -f scripts/search_acquisition_smoke.py ]; then
            python3 scripts/search_acquisition_smoke.py --fixtures source-fixtures --output source-fixtures/acquisition-result.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecoflot-source-depth-checks
          path: |
            scripts/
            tests/
            source-fixtures/
          retention-days: 3
