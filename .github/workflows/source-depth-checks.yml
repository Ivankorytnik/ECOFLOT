name: ECOFLOT source depth and card checks
on:
  push:
    branches: ['repair/20261017-source-depth-cards']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ecoflot-source-depth-checks
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/repair/20261017-source-depth-cards'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ECOFLOT_NOTIFY_SUMMARY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/20261017-source-depth-cards
          fetch-depth: 0
      - name: Apply hash-verified reviewed source patch on repair branch only
        run: |
          python3 - <<'PY'
          import base64,hashlib,lzma,pathlib,subprocess
          paths=[pathlib.Path('maintenance/source-depth/patch-'+str(i)+'.b64') for i in range(1,5)]
          if any(p.exists() for p in paths):
            assert all(p.exists() for p in paths), 'INCOMPLETE_PATCH_PARTS'
            encoded=''.join(p.read_text().strip() for p in paths)
            assert len(encoded)==24872, 'PATCH_LENGTH_MISMATCH'
            patch=lzma.decompress(base64.b64decode(encoded,validate=True))
            assert hashlib.sha256(patch).hexdigest()=='3f2d7dea48d969ae88f10508d14ac7f4024532fb1663477e6fd68609e3392572', 'PATCH_HASH_MISMATCH'
            allowed={'card_acquisition.py','internet_leads_monitor.py','search_acquisition_smoke.py','search_runtime.py','social_depth.py','social_leads_monitor.py','source_markup.py','tender_acquisition.py','tender_monitor.py','test_search_acquisition_depth.py'}
            observed={line[14:] for line in patch.decode().splitlines() if line.startswith('+++ b/scripts/')}
            assert observed==allowed, ('PATCH_SCOPE_MISMATCH',observed)
            subprocess.run(['git','apply','--check','-'],input=patch,check=True)
            subprocess.run(['git','apply','-'],input=patch,check=True)
          else:
            assert pathlib.Path('scripts/test_search_acquisition_depth.py').exists(), 'NO_SOURCE_PATCH_PRESENT'
          PY
      - name: Capture bounded public GET fixtures, no credentials and no lead writes
        run: |
          python3 - <<'PY'
          import json,pathlib,urllib.request,concurrent.futures
          root=pathlib.Path('source-fixtures');root.mkdir(exist_ok=True)
          urls={
            'rentag':'https://rentag.ru/arenda-spectehniki/zayavki',
            'exkavator':'https://exkavator.ru/exchange/rent/main.html',
            'nerudonline':'https://nerudonline.ru/rabota/samosvaly',
            'npd':'https://www.napodrabotku.ru/order/95097956',
            'telegram':'https://t.me/s/vsem_podryad',
            'telegram-trucks':'https://t.me/s/samosvalam_rabota',
            'b2b':'https://www.b2b-center.ru/market/?f_keyword=%D0%B2%D1%8B%D0%B2%D0%BE%D0%B7%20%D1%81%D0%BD%D0%B5%D0%B3%D0%B0',
          }
          def grab(pair):
            name,url=pair
            try:
              request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 ECOFLOT-Source-Verification/1.0','Accept-Language':'ru-RU,ru;q=0.9'})
              with urllib.request.urlopen(request,timeout=20) as response:
                raw=response.read(2000000);charset=response.headers.get_content_charset() or 'utf-8'
                page=raw.decode(charset,'replace');final=response.geturl()
              (root/(name+'.html')).write_text(page,encoding='utf-8')
              return {'name':name,'url':url,'final_url':final,'bytes':len(raw)}
            except Exception as exc:return {'name':name,'url':url,'error':str(exc)[:300]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:result=list(pool.map(grab,urls.items()))
          (root/'manifest.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Run complete offline regression suite
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts
          python3 -m unittest discover -s scripts -p 'test_search_*.py' -v
          node tests/server_guards.test.js
      - name: Verify real public acquisition without sending or writing leads
        run: python3 -u scripts/search_acquisition_smoke.py --fixtures source-fixtures --output source-fixtures/acquisition-result.json
      - name: Save tested source files on repair branch only
        run: |
          set -euo pipefail
          git add scripts/card_acquisition.py scripts/internet_leads_monitor.py scripts/search_acquisition_smoke.py scripts/search_runtime.py scripts/social_depth.py scripts/social_leads_monitor.py scripts/source_markup.py scripts/tender_acquisition.py scripts/tender_monitor.py scripts/test_search_acquisition_depth.py
          if [ -f maintenance/source-depth/patch-1.b64 ]; then
            git rm maintenance/source-depth/patch-1.b64 maintenance/source-depth/patch-2.b64 maintenance/source-depth/patch-3.b64 maintenance/source-depth/patch-4.b64
          fi
          if ! git diff --cached --quiet; then
            git config user.name ecoflot-bot
            git config user.email ecoflot-bot@users.noreply.github.com
            git commit -m 'Apply tested individual-card, deep Telegram and primary tender collectors'
            git push origin HEAD:refs/heads/repair/20261017-source-depth-cards
          fi
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecoflot-source-depth-checks
          path: |
            scripts/
            tests/
            source-fixtures/
          retention-days: 3
