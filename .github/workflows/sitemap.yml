name: Keep sitemap current

on:
  push:
    branches: [main]
    paths:
      - '**/index.html'
      - 'scripts/generate_sitemap.py'
      - 'scripts/seo_repair.py'
      - 'scripts/seo_audit.py'

permissions:
  contents: write

jobs:
  sitemap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair SEO pages
        run: python3 scripts/seo_repair.py
      - name: Generate sitemap
        run: python3 scripts/generate_sitemap.py
      - name: Commit SEO rebuild if changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "SEO pages and sitemap are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "SEO: rebuild geo pages and internal links"
          git push
