name: ECOFLOT Social Leads relay

on:
  push:
    branches: [main]
    paths:
      - "social_leads_queue.json"
      - "scripts/social_leads_relay.py"
      - ".github/workflows/social-leads-relay.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ecoflot-social-leads-relay
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send Social Leads to Telegram
        run: python3 scripts/social_leads_relay.py

      - name: Save sent Social Lead IDs
        run: |
          if [ -n "$(git status --porcelain social_leads_state.json)" ]; then
            git config user.name "ecoflot-bot"
            git config user.email "ecoflot-bot@users.noreply.github.com"
            git add social_leads_state.json
            git commit -m "Update Social Leads relay state"
            git pull --rebase origin main
            git push origin main
          fi
