name: ECOFLOT automation queue dispatcher

on:
  push:
    branches: [main]
    paths:
      - "automation_queue/**"
      - "scripts/automation_queue_dispatch.py"
      - ".github/workflows/automation-queue-dispatch.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ecoflot-automation-queue-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch queued records through Apps Script
        run: python3 scripts/automation_queue_dispatch.py
      - name: Remove processed queue files
        run: |
          if [ -n "$(git status --porcelain automation_queue)" ]; then
            git config user.name "ecoflot-bot"
            git config user.email "ecoflot-bot@users.noreply.github.com"
            git add -A automation_queue
            git commit -m "Consume ECOFLOT automation queue"
            git pull --rebase origin main
            git push origin main
          fi
