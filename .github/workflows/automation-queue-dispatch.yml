name: ECOFLOT legacy automation queue (manual safety hold)
# Legacy payloads are retained, never deleted or automatically replayed.
# Search delivery is owned by full-cycle.yml and the native Telegram queue.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety-hold:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the blocked legacy dispatcher
        run: |
          echo 'Legacy queue replay is disabled: duplicate=true and telegramSent counts are not delivery receipts.'
          echo 'Review existing records and native Telegram routes before re-enqueueing missing recipients.'
          exit 1
