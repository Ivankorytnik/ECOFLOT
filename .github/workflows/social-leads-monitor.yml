name: ECOFLOT public social leads monitor

on:
  schedule:
    - cron: "0 5 * * *"   # 08:00 Moscow (UTC+3)
    - cron: "0 11 * * *"  # 14:00 Moscow (UTC+3)
    - cron: "0 15 * * *"  # 18:00 Moscow (UTC+3)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/social-leads-monitor.yml'
      - 'scripts/social_leads_monitor.py'
      - 'scripts/max_leads_monitor.py'
      - 'scripts/internet_leads_monitor.py'
      - 'scripts/search_completion_report.py'

permissions:
  contents: write

concurrency:
  group: ecoflot-public-social-leads-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan public Telegram demand feeds
        id: telegram_scan
        continue-on-error: true
        env:
          MAX_SEND: "50"
          SUPPRESS_NO_RESULTS: "1"
        run: python3 scripts/social_leads_monitor.py

      - name: Scan public MAX demand feeds
        id: max_scan
        continue-on-error: true
        env:
          MAX_SEND: "50"
          SUPPRESS_NO_RESULTS: "1"
        run: python3 scripts/max_leads_monitor.py

      - name: Save processed social IDs
        if: always()
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain social_public_leads_state.json max_public_leads_state.json telegram_retry_queue.json)" ]; then
            git config user.name "ecoflot-bot"
            git config user.email "ecoflot-bot@users.noreply.github.com"
            git add social_public_leads_state.json max_public_leads_state.json telegram_retry_queue.json 2>/dev/null || git add social_public_leads_state.json max_public_leads_state.json
            git commit -m "Update Telegram and MAX lead monitor state" || true
            git pull --rebase origin main || true
            git push origin main || true
          fi

      - name: Report search result to Telegram
        if: always()
        env:
          TELEGRAM_OUTCOME: ${{ steps.telegram_scan.outcome }}
          MAX_OUTCOME: ${{ steps.max_scan.outcome }}
        run: python3 scripts/search_completion_report.py social


      - name: Persist final Telegram retry queue
        if: always()
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain telegram_retry_queue.json)" ]; then
            git config user.name "ecoflot-bot"
            git config user.email "ecoflot-bot@users.noreply.github.com"
            git add telegram_retry_queue.json
            git commit -m "Persist final Telegram retry queue" || true
            git pull --rebase origin main || true
            git push origin main || true
          fi
