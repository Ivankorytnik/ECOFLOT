name: ECOFLOT public social leads monitor

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/social_leads_monitor.py"
      - ".github/workflows/social-leads-monitor.yml"

permissions:
  contents: write

concurrency:
  group: ecoflot-public-social-leads-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan public Telegram demand feeds
        env:
          MAX_SEND: "50"
        run: python3 scripts/social_leads_monitor.py

      - name: Save processed social IDs
        run: |
          if [ -n "$(git status --porcelain social_public_leads_state.json)" ]; then
            git config user.name "ecoflot-bot"
            git config user.email "ecoflot-bot@users.noreply.github.com"
            git add social_public_leads_state.json
            git commit -m "Update public social leads monitor state"
            git pull --rebase origin main
            git push origin main
          fi
