name: ECOFLOT tender monitor

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/tender-monitor.yml"
      - "scripts/tender_monitor.py"

permissions:
  contents: write

concurrency:
  group: ecoflot-tender-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tender monitor
        env:
          MAX_SEND: "8"
        run: python3 scripts/tender_monitor.py

      - name: Save sent tender IDs
        run: |
          if [ -n "$(git status --porcelain tender_state.json)" ]; then
            git config user.name "ecoflot-bot"
            git config user.email "ecoflot-bot@users.noreply.github.com"
            git add tender_state.json
            git commit -m "Update tender monitor state"
            git push
          fi
