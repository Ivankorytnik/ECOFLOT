name: ECOFLOT tender monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "manual-trigger-token.txt"

permissions:
  contents: write

concurrency:
  group: ecoflot-tender-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tender monitor
        id: scan
        continue-on-error: true
        env:
          MAX_SEND: "100"
        run: python3 scripts/tender_monitor.py

      - name: Save sent tender IDs
        if: always()
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain tender_state.json telegram_retry_queue.json)" ]; then
            git config user.name "ecoflot-bot"
            git config user.email "ecoflot-bot@users.noreply.github.com"
            git add tender_state.json telegram_retry_queue.json 2>/dev/null || git add tender_state.json
            git commit -m "Update tender monitor state" || true
            git pull --rebase origin main || true
            git push origin main || true
          fi
