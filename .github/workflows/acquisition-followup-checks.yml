name: ECOFLOT acquisition followup checks
on:
  push:
    branches: ['repair/20261017-acquisition-followup']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ecoflot-acquisition-followup
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/repair/20261017-acquisition-followup'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ECOFLOT_NOTIFY_SUMMARY: '0'
      SUPPRESS_NO_RESULTS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/20261017-acquisition-followup
          fetch-depth: 0
      - name: Apply readable patch only to exact reviewed source hashes
        run: |
          python3 - <<'PY'
          import hashlib,subprocess
          from pathlib import Path
          expected={
            'scripts/card_acquisition.py': ('c2b0e23d582eeb25cfc8c41fd86a75e81490a59c','b54446b9806e8fa03c500934cdda7aa0e594deba'),
            'scripts/search_runtime.py': ('8c0736e093681d01154cd8bc2310e538e3012ac2','9fbda66e1b7876821e4378efdfdf52cecf678fae'),
            'scripts/social_depth.py': ('ae5dec2d83d4e0d7fd648462d151562ba3783087','f8278d2895aee6c4db11f8aa953538e6496dd354'),
            'scripts/social_leads_monitor.py': ('db31c8d4a425ae0b27bc26e5bf7c0e726dc09d46','fd4b8697ede980f9b69671dec864b451c43e985a'),
            'scripts/tender_acquisition.py': ('68c97f2800eca951e1efbe252f78956ed9775bc3','4ffdd804b1d34409d9630da003c3fe45a76a9e56'),
            'scripts/tender_monitor.py': ('bae60fa4b51f5784df77c005f6c99da3eec5c1c6','13ce052e17d9ff2f3c85d5f28922e8fc82ca4070'),
          }
          def sha(path):
            raw=Path(path).read_bytes()
            return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          if not all(sha(p)==v[1] for p,v in expected.items()):
            if not all(sha(p)==v[0] for p,v in expected.items()):
              raise RuntimeError('Source changed: do not apply stale patch')
            subprocess.run(['git','apply','--check','--unidiff-zero','--whitespace=error-all','maintenance/source-depth-followup.patch'],check=True)
            subprocess.run(['git','apply','--unidiff-zero','--whitespace=error-all','maintenance/source-depth-followup.patch'],check=True)
          if not all(sha(p)==v[1] for p,v in expected.items()):
            raise RuntimeError('Patched content does not match reviewed hashes')
          print('All six source files match locally tested content')
          PY
      - name: Run full offline regression suite
        run: |
          set -euo pipefail
          mkdir -p acquisition-evidence
          python3 -m compileall -q scripts
          python3 -m unittest discover -s scripts -p 'test_search_*.py' -v 2>&1 | tee acquisition-evidence/tests.log
          node tests/server_guards.test.js | tee acquisition-evidence/server-tests.log
      - name: Test real public sources without lead writes or sends
        run: python3 -u scripts/acquisition_followup_smoke.py
      - name: Persist only tested source changes on repair branch
        run: |
          set -euo pipefail
          git add scripts/card_acquisition.py scripts/search_runtime.py scripts/social_depth.py scripts/social_leads_monitor.py scripts/tender_acquisition.py scripts/tender_monitor.py
          git rm --ignore-unmatch maintenance/apply_acquisition_followup.py maintenance/source-depth-followup.patch
          if ! git diff --cached --quiet; then
            git config user.name ecoflot-bot
            git config user.email ecoflot-bot@users.noreply.github.com
            git commit -m 'Apply verified acquisition fixes and remove temporary installers'
            git push origin HEAD:refs/heads/repair/20261017-acquisition-followup
          fi
          git rev-parse HEAD | tee acquisition-evidence/tested-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecoflot-acquisition-verified
          path: |
            acquisition-evidence/
            scripts/
          retention-days: 7
