name: ECOFLOT visible contact card inspection
on:
  push:
    branches: ['diagnostics/20261017-card-contacts']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install ordinary browser
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Read only visible public pages, no login or forms
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          urls={
            'vsem-66321':'https://vsem-podryad.ru/request/86b094bb-e9b1-4ae6-8698-1c6dae6ccc39/?from=tg_post',
            'vsem-66326':'https://vsem-podryad.ru/request/ac9e0b9a-cb46-4fcd-b4ff-c4b37a11ae1e/?from=tg_post',
          }
          folder=Path('contact-inspection');folder.mkdir(exist_ok=True)
          results=[]
          with sync_playwright() as p:
            browser=p.chromium.launch()
            context=browser.new_context(locale='ru-RU')
            for key,url in urls.items():
              page=context.new_page()
              try:
                response=page.goto(url,wait_until='domcontentloaded',timeout=25000)
                page.wait_for_timeout(2500)
                text=page.locator('body').inner_text(timeout=10000)
                source=page.content()
                (folder/(key+'.txt')).write_text(text,encoding='utf-8')
                (folder/(key+'.html')).write_text(source,encoding='utf-8')
                results.append({'source':url,'final_url':page.url,'status':response.status if response else None,'title':page.title(),'visible_chars':len(text),'file':key,'read_only':True})
              except Exception as exc:results.append({'source':url,'error':str(exc)[:300]})
              finally:page.close()
            browser.close()
          (folder/'manifest.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          print(json.dumps(results,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecoflot-visible-contact-cards
          path: contact-inspection/
          retention-days: 3
