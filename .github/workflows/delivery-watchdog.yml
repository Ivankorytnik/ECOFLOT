name: ECOFLOT delivery watchdog

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecoflot-delivery-watchdog
  cancel-in-progress: false

jobs:
  delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Legacy watchdog disabled
        run: echo "Legacy process-outbox route is disabled; full-cycle delivery is inline."
