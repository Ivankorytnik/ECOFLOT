name: ECOFLOT notify fresh public leads

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/send-fresh-public-leads.yml"

jobs:
  notify:
    if: contains(github.event.head_commit.message, 'Notify fresh public leads retry')
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram without duplicate rows
        run: |
          set -euo pipefail
          WEBHOOK="https://script.google.com/macros/s/AKfycbzDedkBi9soafe6DuR0TX0Enpg0vcgX87gNyOLsl30kL4COSuwdmPWO64c1ZzNodmFlRg/exec"
          notify () {
            payload="$(python3 -c 'import json,sys; print(json.dumps({"mode":"notify-only","message":sys.argv[1]}, ensure_ascii=False))' "$1")"
            response="$(curl -sS -L -H "Content-Type: application/json" -X POST -d "$payload" "$WEBHOOK")"
            echo "$response"
            echo "$response" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'
          }
          notify "Новая заявка ECOFLOT | 93/100 | Истра | Вывоз строительного мусора. Битый кирпич, бетон, дерево и мелкий строительный мусор после устройства бетонной площадки. Техника: бункеровоз / мультилифт / самосвал. https://www.napodrabotku.ru/order/94341856 | CRM: https://ecoflot.pro/#crm/leads"
          notify "Новая заявка ECOFLOT | 91/100 | Истра | Расчистка / погрузка и вывоз. Строительный мусор вокруг дома, вынести к дороге, загрузить и вывезти. Техника: экскаватор-погрузчик + самосвал / контейнер. https://www.napodrabotku.ru/order/94351957 | CRM: https://ecoflot.pro/#crm/leads"
          notify "Новая заявка ECOFLOT | 83/100 | Красногорск | 15-20 мешков бетона + 17 поддонов, погрузка и вывоз. Техника: Газель / бункеровоз / мультилифт. https://www.napodrabotku.ru/order/94248164 | CRM: https://ecoflot.pro/#crm/leads"
