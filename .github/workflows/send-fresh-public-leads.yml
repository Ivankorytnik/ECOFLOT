name: ECOFLOT debug notify webhook

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/send-fresh-public-leads.yml"

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture webhook response
        run: |
          set -euo pipefail
          WEBHOOK="https://script.google.com/macros/s/AKfycbzDedkBi9soafe6DuR0TX0Enpg0vcgX87gNyOLsl30kL4COSuwdmPWO64c1ZzNodmFlRg/exec"
          PAYLOAD='{"mode":"notify-only","message":"ECOFLOT test notify-only"}'
          curl -sS -L -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$WEBHOOK" > notify_webhook_response.txt
          cat notify_webhook_response.txt
      - name: Save response
        run: |
          git config user.name "ecoflot-bot"
          git config user.email "ecoflot-bot@users.noreply.github.com"
          git add notify_webhook_response.txt
          git commit -m "Capture notify webhook response" || exit 0
          git pull --rebase origin main
          git push origin main
