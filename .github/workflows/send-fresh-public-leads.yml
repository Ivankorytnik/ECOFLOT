name: ECOFLOT send fresh public leads

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/send-fresh-public-leads.yml"

jobs:
  send:
    if: contains(github.event.head_commit.message, 'Send fresh public leads now')
    runs-on: ubuntu-latest
    steps:
      - name: Send Krasnogorsk soil transport lead
        run: |
          set -euo pipefail
          curl -sS -L -X POST \
            --data-urlencode "type=Интернет-заявка" \
            --data-urlencode "name=Перевозка грунта Красногорск → Онуфриево" \
            --data-urlencode "phone=8 905 718-83-00" \
            --data-urlencode "wasteType=Перевозка грунта" \
            --data-urlencode "volume=-" \
            --data-urlencode "when=Актуальная заявка" \
            --data-urlencode "address=Красногорск → Онуфриево, Московская область" \
            --data-urlencode "source=Telegram / Самосвалам работа" \
            --data-urlencode "status=Новая" \
            --data-urlencode "comment=Релевантность: 90/100. Нужны самосвалы для перевозки грунта. Работа заявлена как долгосрочная и постоянная. Погрузка в Красногорске, направление Онуфриево. Оплата раз в неделю, возможен аванс на топливо. Подходящая техника ECOFLOT: самосвалы. Источник: https://t.me/s/samosvalam_rabota" \
            --data-urlencode "requestId=SOCIAL-TG-KRASNOGORSK-GRUNT-20260926-01" \
            "https://script.google.com/macros/s/AKfycbzDedkBi9soafe6DuR0TX0Enpg0vcgX87gNyOLsl30kL4COSuwdmPWO64c1ZzNodmFlRg/exec"
