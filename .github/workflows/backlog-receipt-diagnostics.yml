name: ECOFLOT legacy receipt diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/backlog-receipt-diagnostics.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ECOFLOT_NOTIFY_SUMMARY: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Classify historical receipt discrepancies without replay
        run: |
          python3 - <<'PY'
          import sys, json
          from collections import Counter
          sys.path.insert(0, 'scripts')
          from search_reliability import sheet_rows, routes_from
          from search_recipients import active_chats
          from search_runtime import audit_delivery
          sid='1wQQhP81P_07QkAGB5KzI20w9PBqN55y9pUs6WUnA8Ws'
          expected=active_chats(sheet_rows(sid,'Пользователи бота','A,E'))
          if not expected: raise RuntimeError('NO_VERIFIED_RECIPIENTS')
          rows=sheet_rows(sid,'Заявки','L,M,U,V,J,O,G,A')
          queue=sheet_rows(sid,'Очередь Telegram','B,C,D,E,F,G')
          for row in rows:
              row=list(row)+['']*8
              one=audit_delivery([row[:4]],expected)
              if not one.get('pending'): continue
              states=Counter(); saved=set()
              for q in queue:
                  q=list(q)+['']*6
                  if q[0]!='lead_one' or not str(q[1]).startswith(str(row[2])+'|'): continue
                  states[str(q[5])]+=1
                  try:
                      p=json.loads(q[2]); rs=routes_from([p.get('_ef5',{}).get('receipt')])
                      if q[5]=='SENT' and int(q[3] or 0)>0: saved.update(r['chatId'] for r in rs)
                  except (ValueError,TypeError): pass
              print(json.dumps({'request_id':row[0],'telegram_status':row[3],
                  'business_status':row[4],'score':row[5],'source_date':row[6],'record_date':row[7],
                  'valid_routes':len(routes_from(row[1])),'expected_recipients':len(expected),
                  'queue_states':dict(states),'queue_receipt_recipients':len(saved),
                  'all_queue_receipts_present':bool(expected) and expected.issubset(saved)},ensure_ascii=False))
          print('READ_ONLY: no lead sends, no queue processing, no CRM writes.')
          PY
