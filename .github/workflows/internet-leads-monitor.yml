name: ECOFLOT internet leads monitor

on:
  schedule:
    - cron: "0 5 * * *"   # 08:00 Moscow (UTC+3)
    - cron: "0 11 * * *"  # 14:00 Moscow (UTC+3)
    - cron: "0 15 * * *"  # 18:00 Moscow (UTC+3)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/internet-leads-monitor.yml"
      - "scripts/internet_leads_monitor.py"

permissions:
  contents: write

concurrency:
  group: ecoflot-internet-leads-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan public internet requests
        env:
          MAX_SEND: "50"
          RECENT_DAYS: "7"
        run: python3 scripts/internet_leads_monitor.py

      - name: Save processed request IDs
        run: |
          if [ -n "$(git status --porcelain internet_leads_state.json telegram_retry_queue.json)" ]; then
            git config user.name "ecoflot-bot"
            git config user.email "ecoflot-bot@users.noreply.github.com"
            git add internet_leads_state.json telegram_retry_queue.json 2>/dev/null || git add internet_leads_state.json
            git commit -m "Update internet leads monitor state"
            git pull --rebase origin main
            git push origin main
          fi
