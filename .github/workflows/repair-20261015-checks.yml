name: ECOFLOT repair verification 2026-10-15
on:
  push:
    branches: ['repair/20261015-delivery-scheduler']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ecoflot-repair-20261015
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/repair/20261015-delivery-scheduler'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ECOFLOT_NOTIFY_SUMMARY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/20261015-delivery-scheduler
          fetch-depth: 0
      - name: Apply reviewed source changes on repair branch only
        run: python3 maintenance/repair_20261015.py
      - name: Compile and run all regression tests without Telegram notifications
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts
          python3 -m unittest discover -s scripts -p 'test_search_*.py' -v
          node tests/server_guards.test.js
      - name: Save only tested source changes on repair branch
        run: |
          set -euo pipefail
          git add scripts/full_cycle_orchestrator.py scripts/scheduled_cycle_runner.py
          if ! git diff --cached --quiet; then
            git config user.name ecoflot-bot
            git config user.email ecoflot-bot@users.noreply.github.com
            git commit -m 'Apply tested receipt reconciliation and manual-search fixes'
            git push origin HEAD:refs/heads/repair/20261015-delivery-scheduler
          fi
          git rev-parse HEAD
