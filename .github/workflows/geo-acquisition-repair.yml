name: ECOFLOT geography and acquisition regression checks
on:
  push:
    branches: ['repair/20261017-geo-acquisition']
    paths: ['.github/workflows/geo-acquisition-repair.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/repair/20261017-geo-acquisition'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      ECOFLOT_NOTIFY_SUMMARY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/20261017-geo-acquisition
          fetch-depth: 0
      - name: Apply exact reviewed replacements without changing other fixes
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json
          from pathlib import Path
          encoded=''
          raw=gzip.decompress(base64.b64decode(encoded))
          if hashlib.sha256(raw).hexdigest()!='8047506411ce0b01e440829ca26e2d747bf5ab7ea4808c1883468371eceba0c0': raise RuntimeError('PATCH_CHECKSUM_MISMATCH')
          bundle=json.loads(raw)
          expected={'scripts/internet_leads_monitor.py'}
          if set(bundle['replacements'])!=expected: raise RuntimeError('UNEXPECTED_TARGET')
          for name,changes in bundle['replacements'].items():
            path=Path(name);text=path.read_text('utf-8')
            for old,new in changes:
              if text.count(old)==1: text=text.replace(old,new,1)
              elif text.count(new)!=1: raise RuntimeError('SOURCE_CHANGED: '+name)
            path.write_text(text,encoding='utf-8')
          if set(bundle['files'])!={'scripts/test_search_geo_acquisition.py'}: raise RuntimeError('UNEXPECTED_TEST_FILE')
          for name,text in bundle['files'].items(): Path(name).write_text(text,encoding='utf-8')
          print('Exact geography and candidate removal repairs applied on isolated branch.')
          PY
      - name: Run all search regression contracts and server guards
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts
          python3 -m unittest discover -s scripts -p 'test_search_*.py' -v
          node tests/server_guards.test.js
      - name: Save tested source only on repair branch
        run: |
          set -euo pipefail
          git add scripts/internet_leads_monitor.py scripts/test_search_geo_acquisition.py
          if ! git diff --cached --quiet; then
            git config user.name ecoflot-bot
            git config user.email ecoflot-bot@users.noreply.github.com
            git commit -m 'Fix false Moscow geography matches and exclude removed discovery cards'
            git push origin HEAD:refs/heads/repair/20261017-geo-acquisition
          fi
          git rev-parse HEAD
