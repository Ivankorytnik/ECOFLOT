name: ECOFLOT Telegram retry dispatcher (manual legacy reserve)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ecoflot-telegram-retry-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retry legacy text-only queue
        run: python3 scripts/telegram_retry_dispatch.py
      - name: Save retry queue
        run: |
          if [ -n "$(git status --porcelain telegram_retry_queue.json)" ]; then
            git config user.name "ecoflot-bot"
            git config user.email "ecoflot-bot@users.noreply.github.com"
            git add telegram_retry_queue.json
            git commit -m "Update Telegram retry queue" || true
            git pull --rebase origin main || true
            git push origin main || true
          fi
